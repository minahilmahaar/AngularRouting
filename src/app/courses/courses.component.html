<div class="banner">  
  <img src="https://media.istockphoto.com/id/1290864946/photo/e-learning-education-concept-learning-online.jpg?s=612x612&w=0&k=20&c=y1fQ-3wbsvdDaMn-cuHPibcgozOxKQS99mIgz6DFcVA=">
  <h1>Empower your future with Pracademy – High quality online coding classes</h1>
</div>

<div class="course-page">
  <h1>Chose the course best suits you <hr></h1>
</div>

<div class="courses-container">
  <div class="course-card" *ngFor="let c of AllCourses">
    <img [src]="c.image" alt="Course Image">

    <div class="card-content">
      <h3>{{ c.title }}</h3>
      <p>{{ c.desc }}</p>
      <div class="price-rating">PRICE: ${{ c.price }}</div>

      <div class="card-buttons">
        <button class="detail-btn" [routerLink]="['/course', c.id]">DETAILS</button>
        <button class="buy-btn" [routerLink]="['/course-buy', c.id]">BUY NOW</button>
      </div>
    </div>
  </div>
</div>
